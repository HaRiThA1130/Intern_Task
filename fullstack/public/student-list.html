<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student List - Student Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="dashboard.html" class="brand">
      <svg viewBox="0 0 24 24">
        <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
      </svg>
      SMS Portal
    </a>
    <ul class="nav-links">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="student.html">Register Student</a></li>
      <li><a href="student-list.html" class="active">Student List</a></li>
      <li><a href="#" class="btn-logout" onclick="logout()">Logout</a></li>
    </ul>
  </nav>

  <!-- Main Container -->
  <div class="container">
    <div class="table-header-bar">
      <div>
        <h2>Registered Students</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">View, search, update, or remove registered student entries.</p>
      </div>

      <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
        <!-- Search Bar -->
        <div class="search-box">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <input type="text" id="searchInput" class="form-control" placeholder="Search student by name...">
        </div>

        <a href="student.html" class="btn btn-primary">+ Add Student</a>
      </div>
    </div>

    <!-- Student Table -->
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Department</th>
            <th>Gender</th>
            <th>Date of Birth</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="studentTableBody">
          <!-- Populated dynamically via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Edit Student Modal -->
  <div id="editModal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h2>Edit Student Profile</h2>
        <button class="close-btn" onclick="closeEditModal()">&times;</button>
      </div>

      <form id="editForm" onsubmit="saveEditStudent(event)">
        <div class="form-group">
          <label for="editName">Student Name *</label>
          <input type="text" id="editName" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="editEmail">Email Address *</label>
          <input type="email" id="editEmail" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="editPhone">Phone Number *</label>
          <input type="text" id="editPhone" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="editDepartment">Department *</label>
          <select id="editDepartment" class="form-control" required>
            <option value="CSE">CSE</option>
            <option value="ECE">ECE</option>
            <option value="EEE">EEE</option>
            <option value="Mechanical">Mechanical</option>
          </select>
        </div>

        <div class="form-group">
          <label>Gender *</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="editGender" value="Male"> Male
            </label>
            <label class="radio-option">
              <input type="radio" name="editGender" value="Female"> Female
            </label>
            <label class="radio-option">
              <input type="radio" name="editGender" value="Other"> Other
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="editDob">Date of Birth *</label>
          <input type="date" id="editDob" class="form-control">
        </div>

        <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
