<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Student Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-wrapper">

  <div class="auth-card">
    <div class="auth-header">
      <h1>Student Portal</h1>
      <p>Enter your credentials to access the management system</p>
    </div>

    <div id="loginAlert" class="alert alert-danger" style="display: none;"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter username" required autocomplete="username">
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label for="password" style="margin-bottom: 0;">Password</label>
          <a href="#" onclick="openForgotPasswordModal(event)" style="font-size: 0.825rem; color: var(--primary); text-decoration: none; font-weight: 500;">Forgot Password?</a>
        </div>
        <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Login</button>
    </form>
  </div>

  <!-- Mock Forgot Password Modal -->
  <div id="forgotPasswordModal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h2>Reset Password</h2>
        <button class="close-btn" onclick="closeForgotPasswordModal()">&times;</button>
      </div>

      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.25rem;">
        Enter your registered email address below. We will send a secure password reset link to your inbox.
      </p>

      <div id="forgotAlert" class="alert alert-success" style="display: none;"></div>

      <form id="forgotPasswordForm" onsubmit="handleForgotPasswordSubmit(event)">
        <div class="form-group">
          <label for="resetEmail">Registered Email Address *</label>
          <input type="email" id="resetEmail" class="form-control" placeholder="e.g. admin@company.com" required>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" onclick="closeForgotPasswordModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Send Reset Link</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
