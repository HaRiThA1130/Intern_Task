<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Student Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-wrapper">

  <div class="auth-card">
    <div class="auth-header">
      <h1>Student Portal</h1>
      <p>Enter your credentials to access the management system</p>
    </div>

    <div id="loginAlert" class="alert alert-danger" style="display: none;"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter username (e.g. admin)" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter password (e.g. admin123)" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Login</button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.825rem; color: var(--text-muted); background: #f1f5f9; padding: 0.75rem; border-radius: var(--radius-sm);">
      <strong>Demo Credentials:</strong><br>
      Username: <code>admin</code> | Password: <code>admin123</code>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
