<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Student - Student Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="dashboard.html" class="brand">
      <svg viewBox="0 0 24 24">
        <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
      </svg>
      SMS Portal
    </a>
    <ul class="nav-links">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="student.html" class="active">Register Student</a></li>
      <li><a href="student-list.html">Student List</a></li>
      <li><a href="#" class="btn-logout" onclick="logout()">Logout</a></li>
    </ul>
  </nav>

  <!-- Main Container -->
  <div class="container" style="max-width: 650px;">
    <div class="card">
      <div style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
        <h2>Student Registration</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Fill in the details below to register a new student.</p>
      </div>

      <div id="successAlert" class="alert alert-success" style="display: none;">
        Student registered successfully! Redirecting to student list...
      </div>

      <form id="studentForm" novalidate>
        <!-- Student Name -->
        <div class="form-group">
          <label for="name">Student Name *</label>
          <input type="text" id="name" class="form-control" placeholder="Enter full name (e.g. John Doe)">
          <div id="nameError" class="error-message"></div>
        </div>

        <!-- Email Address -->
        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" class="form-control" placeholder="Enter email address (e.g. john@gmail.com)">
          <div id="emailError" class="error-message"></div>
        </div>

        <!-- Phone Number -->
        <div class="form-group">
          <label for="phone">Phone Number *</label>
          <input type="text" id="phone" class="form-control" placeholder="Enter 10-digit mobile number">
          <div id="phoneError" class="error-message"></div>
        </div>

        <!-- Department Dropdown -->
        <div class="form-group">
          <label for="department">Department *</label>
          <select id="department" class="form-control">
            <option value="">-- Select Department --</option>
            <option value="CSE">CSE</option>
            <option value="ECE">ECE</option>
            <option value="EEE">EEE</option>
            <option value="Mechanical">Mechanical</option>
          </select>
          <div id="departmentError" class="error-message"></div>
        </div>

        <!-- Gender Radio Button -->
        <div class="form-group">
          <label>Gender *</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="gender" value="Male"> Male
            </label>
            <label class="radio-option">
              <input type="radio" name="gender" value="Female"> Female
            </label>
            <label class="radio-option">
              <input type="radio" name="gender" value="Other"> Other
            </label>
          </div>
          <div id="genderError" class="error-message"></div>
        </div>

        <!-- Date of Birth -->
        <div class="form-group">
          <label for="dob">Date of Birth *</label>
          <input type="date" id="dob" class="form-control">
          <div id="dobError" class="error-message"></div>
        </div>

        <!-- Buttons -->
        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
          <button type="submit" class="btn btn-primary" style="flex: 1;">Submit Registration</button>
          <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
